<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>QuestPath - Registration Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Geist:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#dbe2fd",
                        "inverse-primary": "#006877",
                        "inverse-on-surface": "#283044",
                        "on-secondary-fixed": "#2a0848",
                        "surface-container-lowest": "#060d20",
                        "secondary-container": "#583876",
                        "on-primary-fixed": "#001f25",
                        "tertiary": "#eef0ff",
                        "on-primary-fixed-variant": "#004e5a",
                        "error-container": "#93000a",
                        "tertiary-container": "#c7d4fc",
                        "secondary-fixed": "#f0dbff",
                        "primary-fixed-dim": "#4ad8f0",
                        "on-secondary-container": "#cba6ed",
                        "surface-variant": "#2d3449",
                        "surface-container": "#171f33",
                        "on-surface-variant": "#bbc9cc",
                        "outline": "#869396",
                        "inverse-surface": "#dbe2fd",
                        "on-error-container": "#ffdad6",
                        "on-primary": "#00363e",
                        "secondary-fixed-dim": "#ddb7ff",
                        "surface-bright": "#31394e",
                        "primary": "#d5f7ff",
                        "on-tertiary-fixed-variant": "#394667",
                        "secondary": "#ddb7ff",
                        "on-tertiary-fixed": "#0c1a39",
                        "surface-container-high": "#222a3e",
                        "on-secondary": "#40215e",
                        "on-primary-container": "#006573",
                        "tertiary-fixed-dim": "#b9c6ed",
                        "on-tertiary-container": "#4e5b7d",
                        "on-secondary-fixed-variant": "#583876",
                        "primary-container": "#5de6ff",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "surface-container-low": "#131b2e",
                        "surface": "#0b1326",
                        "outline-variant": "#3c494c",
                        "primary-fixed": "#a2eeff",
                        "surface-dim": "#0b1326",
                        "tertiary-fixed": "#dae2ff",
                        "on-tertiary": "#23304f",
                        "on-background": "#dbe2fd",
                        "background": "#0b1326",
                        "surface-container-highest": "#2d3449",
                        "surface-tint": "#4ad8f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "gutter": "1.5rem",
                        "margin-desktop": "4rem",
                        "margin-mobile": "1rem",
                        "container-padding": "2rem"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Space Grotesk"],
                        "body-lg": ["Geist"],
                        "headline-lg": ["Space Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "body-md": ["Geist"],
                        "headline-md": ["Space Grotesk"],
                        "label-md": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0b1326;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(93, 230, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(221, 183, 255, 0.05), transparent 25%);
        }
        
        .glass-panel {
            background: rgba(11, 19, 38, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-ghost {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(221, 183, 255, 0.3);
            color: #dbe2fd;
            transition: all 0.3s ease;
        }

        .input-ghost:focus {
            outline: none;
            border: 1px solid #5de6ff;
            box-shadow: 0 0 15px rgba(93, 230, 255, 0.1);
            border-radius: 0.25rem;
            border-bottom: 1px solid #5de6ff;
        }

        .floating-label-group {
            position: relative;
            margin-top: 1rem;
        }

        .floating-label {
            position: absolute;
            left: 0;
            top: 0.5rem;
            transition: 0.2s ease all;
            pointer-events: none;
            color: #bbc9cc;
        }

        .input-ghost:focus ~ .floating-label,
        .input-ghost:not(:placeholder-shown) ~ .floating-label {
            top: -1.2rem;
            font-size: 12px;
            color: #5de6ff;
        }

        .segmented-control input:checked + label {
            background-color: #5de6ff;
            color: #00363e;
            box-shadow: 0 0 15px rgba(93, 230, 255, 0.3);
        }

        .glow-button {
            background: linear-gradient(135deg, #5de6ff, #ddb7ff);
            color: #0b1326;
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            box-shadow: 0 0 20px rgba(93, 230, 255, 0.5);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<div class="glass-panel w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden flex flex-col z-10 relative">
<!-- Header -->
<div class="p-8 pb-4 border-b border-white/10 flex flex-col items-center text-center">
<img alt="QuestPath Logo" class="h-20 w-auto mb-6 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs6L6coZ5UAiQTijjtkKT_fOcE4EeAMNHYCLUMXAAZF6ZJgOBaoPQJxHtA1uyXhdGh4K_UfDiyrmY_ZC6SdtVZc-LJ03iAzfeONzMYMRxgwxRUrc3SN_yMTFSmNcDJR-aKzkkg7Q_nqEGFz4sqVhJI793smCywjPTITT5o4l-bD4M6Y50WXKzpzDocVDnCj2QYGdYF2QaD29i-FfI8-o1IGivvZW-HQbWRoOElpM1KduK2naY5bYR_VqJ0a" style="filter: drop-shadow(0 0 10px rgba(93, 230, 255, 0.5));">
<div class="bg-error-container/20 border border-error/20 text-error px-4 py-2 rounded-lg font-label-sm flex items-center gap-2 mb-8">
<span class="material-symbols-outlined text-[16px]">lock</span>
                MEMBER TERMINAL ACCESS — COMPLETE YOUR ADVENTURER PROFILE
            </div>
<div class="flex bg-surface-container rounded-full p-1 w-full max-w-sm mb-2 border border-white/5">
<button class="flex-1 py-2 px-4 rounded-full font-label-md text-on-surface-variant hover:text-on-surface transition-colors">LOGIN</button>
<button class="flex-1 py-2 px-4 rounded-full font-label-md bg-surface-bright text-primary shadow-[0_0_10px_rgba(93,230,255,0.2)]">NEW STUDENT REGISTER</button>
</div>
</div>
<!-- Form Area -->
<div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">
<!-- Left Column: Core Details -->
<div class="space-y-6">
<h3 class="font-headline-md text-primary mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">person</span>
                    Identity Parameters
                </h3>
<div class="floating-label-group">
<input class="input-ghost w-full py-2 pl-8 text-on-surface font-body-md" id="fullname" placeholder=" " type="text" style="color: rgb(255, 255, 255);">
<label class="floating-label pl-8 font-label-sm" for="fullname">Enter your full name</label>
<span class="material-symbols-outlined absolute left-0 top-2.5 text-[18px] text-on-surface" style="opacity: 0;">badge</span>
</div>
<div class="floating-label-group">
<input class="input-ghost w-full py-2 pl-8 text-on-surface font-body-md" id="email" placeholder=" " type="email" style="color: rgb(255, 255, 255);">
<label class="floating-label pl-8 font-label-sm" for="email">student@domain.com</label>
<span class="material-symbols-outlined absolute left-0 top-2.5 text-[18px] text-on-surface">mail</span>
</div>
<div class="floating-label-group">
<input class="input-ghost w-full py-2 pl-8 pr-8 text-on-surface font-body-md" id="password" placeholder=" " type="password" style="color: rgb(255, 255, 255);">
<label class="floating-label pl-8 font-label-sm" for="password">Create Secure Passcode</label>
<span class="material-symbols-outlined absolute left-0 top-2.5 text-[18px] text-on-surface">key</span>
<button class="absolute right-0 top-2.5 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Right Column: Academic Details -->
<div class="space-y-6">
<h3 class="font-headline-md text-secondary mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">school</span>
                    Academic Classification
                </h3>
<div class="flex segmented-control bg-surface-container rounded-lg p-1 border border-white/5">
<div class="flex-1 relative">
<input class="peer sr-only" id="school" name="edu_level" type="radio">
<label class="block w-full text-center py-2 rounded-md cursor-pointer font-label-md text-on-surface-variant transition-all" for="school">
                            🏫 School Student
                        </label>
</div>
<div class="flex-1 relative">
<input checked="" class="peer sr-only" id="college" name="edu_level" type="radio">
<label class="block w-full text-center py-2 rounded-md cursor-pointer font-label-md text-on-surface-variant transition-all" for="college">
                            🎓 College Student
                        </label>
</div>
</div>
<!-- College Expanded Section -->
<div class="space-y-6 bg-surface-container/30 p-4 rounded-xl border border-secondary/20">
<div class="floating-label-group mt-2">
<input class="input-ghost w-full py-2 pl-8 text-on-surface font-body-md" id="college_name" placeholder=" " type="text" value="DKTE Textile &amp; Engineering Institute" style="color: rgb(255, 255, 255);">
<label class="floating-label pl-8 font-label-sm" for="college_name">Institution Name</label>
<span class="material-symbols-outlined absolute left-0 top-2.5 text-secondary text-[18px]">account_balance</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="relative">
<select class="input-ghost w-full py-2 pl-2 pr-8 appearance-none text-on-surface font-body-md bg-transparent" style="color: rgb(255, 255, 255);">
<option class="bg-surface text-on-surface" value="1">1st Year</option>
<option class="bg-surface text-on-surface" value="2">2nd Year</option>
<option class="bg-surface text-on-surface" value="3">3rd Year</option>
<option class="bg-surface text-on-surface" value="4">4th Year</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-2.5 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
<label class="absolute -top-4 left-0 font-label-sm text-secondary">Academic Year</label>
</div>
<div class="relative">
<select class="input-ghost w-full py-2 pl-2 pr-8 appearance-none text-on-surface font-body-md bg-transparent" style="color: #ffffff;">
<option class="bg-surface text-on-surface" value="cs">Computer Science</option>
<option class="bg-surface text-on-surface" value="ai">Artificial Intelligence</option>
<option class="bg-surface text-on-surface" value="cyber">Cyber Security</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-2.5 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
<label class="absolute -top-4 left-0 font-label-sm text-secondary">Department</label>
</div>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="p-8 pt-4 bg-surface-container/50 border-t border-white/5 flex flex-col items-center">
<button class="glow-button w-full max-w-md py-4 rounded-xl font-headline-md text-[18px] flex justify-center items-center gap-2">
                Create Adventurer Account &amp; Choose Path 
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="mt-4 font-label-sm text-on-surface-variant">
                Already registered? Switch to <span class="text-primary cursor-pointer hover:underline">Login tab</span> above.
            </p>
</div>
</div>


</body></html>
