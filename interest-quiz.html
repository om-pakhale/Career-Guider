<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>QuestPath | Choose Your Archetype</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #0b1326; color: #dae2fd; font-family: 'Geist', sans-serif; }
    .glass-panel { background: rgba(11, 19, 38, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(221, 183, 255, 0.15); }
    .active-card { border-color: #5de6ff !important; background: rgba(93, 230, 255, 0.05); box-shadow: 0 0 20px rgba(93, 230, 255, 0.2); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="relative w-full max-w-2xl glass-panel rounded-2xl shadow-2xl overflow-hidden border border-slate-800">
    <!-- Progress Header -->
    <div class="p-6 border-b border-slate-800">
      <div class="flex justify-between items-end mb-2">
        <span class="text-xs font-mono text-cyan-400 uppercase tracking-widest">Discovering Tech Archetype</span>
        <span class="text-xs font-mono text-slate-400">Step <span id="current-step">1</span> of 4</span>
      </div>
      <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-cyan-400 transition-all duration-500" style="width: 25%;"></div>
      </div>
    </div>

    <!-- Quiz Content -->
    <div id="quiz-canvas" class="p-6 md:p-8 space-y-6">
      <h2 id="question-text" class="text-2xl font-bold text-slate-100">What excites you the most in technology?</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Option A -->
        <button onclick="selectOption(this, 'Cybersecurity Specialist')" class="option-btn p-4 rounded-xl border border-slate-800 hover:border-cyan-400 bg-slate-900/50 text-left transition flex flex-col gap-2">
          <span class="material-symbols-outlined text-purple-400 text-3xl">terminal</span>
          <h3 class="font-bold text-slate-100">Cybersecurity Shinobi</h3>
          <p class="text-xs text-slate-400">Hunting for system security bugs and vulnerabilities.</p>
        </button>

        <!-- Option B -->
        <button onclick="selectOption(this, 'Full-Stack Developer')" class="option-btn p-4 rounded-xl border border-slate-800 hover:border-cyan-400 bg-slate-900/50 text-left transition flex flex-col gap-2">
          <span class="material-symbols-outlined text-cyan-400 text-3xl">auto_fix_high</span>
          <h3 class="font-bold text-slate-100">Software Alchemist</h3>
          <p class="text-xs text-slate-400">Building web apps and immersive user experiences.</p>
        </button>

        <!-- Option C -->
        <button onclick="selectOption(this, 'AI & Machine Learning Engineer')" class="option-btn p-4 rounded-xl border border-slate-800 hover:border-cyan-400 bg-slate-900/50 text-left transition flex flex-col gap-2">
          <span class="material-symbols-outlined text-cyan-400 text-3xl">psychology</span>
          <h3 class="font-bold text-slate-100">Data Wizard</h3>
          <p class="text-xs text-slate-400">Training AI models and working with machine learning.</p>
        </button>

        <!-- Option D -->
        <button onclick="selectOption(this, 'DevOps & Cloud Architect')" class="option-btn p-4 rounded-xl border border-slate-800 hover:border-cyan-400 bg-slate-900/50 text-left transition flex flex-col gap-2">
          <span class="material-symbols-outlined text-purple-400 text-3xl">groups</span>
          <h3 class="font-bold text-slate-100">Guild Commander</h3>
          <p class="text-xs text-slate-400">Designing cloud infrastructures and managing deployments.</p>
        </button>
      </div>

      <div class="flex justify-end pt-4 border-t border-slate-800">
        <button id="next-btn" disabled onclick="nextStep()" class="px-6 py-2.5 bg-cyan-400 disabled:opacity-30 disabled:cursor-not-allowed text-slate-950 font-bold rounded-xl transition">
          Next Step ➔
        </button>
      </div>
    </div>

    <!-- Final Result Screen (Initially Hidden) -->
    <div id="result-view" class="hidden p-8 text-center space-y-6">
      <div class="w-20 h-20 bg-amber-500/20 border border-amber-500 rounded-full flex items-center justify-center mx-auto text-amber-400 text-4xl font-bold">
        🏆
      </div>
      <div>
        <h2 class="text-2xl font-bold text-slate-100">Archetype Identified!</h2>
        <p id="result-title" class="text-cyan-400 font-semibold mt-1">The Path of the Cybersecurity Shinobi</p>
      </div>
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 text-left">
        ✓ 150 Intro XP Granted<br/>
        ✓ Generated roadmap node pathway customized for your focus area.
      </div>
      <button onclick="claimRoadmap()" class="w-full py-3 bg-purple-500 hover:bg-purple-400 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-purple-500/30">
        Claim Your Roadmap & Enter Dashboard ➔
      </button>
    </div>
  </div>

  <script>
    let step = 1;
    let selectedTrack = 'Cybersecurity Specialist';

    function selectOption(element, track) {
      document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active-card'));
      element.classList.add('active-card');
      selectedTrack = track;
      document.getElementById('next-btn').removeAttribute('disabled');
    }

    function nextStep() {
      if (step < 4) {
        step++;
        document.getElementById('current-step').textContent = step;
        document.getElementById('progress-bar').style.width = (step * 25) + '%';
        document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active-card'));
        document.getElementById('next-btn').setAttribute('disabled', 'true');
      } else {
        document.getElementById('quiz-canvas').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('result-title').textContent = "Path: " + selectedTrack;
      }
    }

    // -------------------------------------------------------------
    // TODO: BACKEND INTEGRATION - SAVE USER ARCHETYPE
    // -------------------------------------------------------------
    function claimRoadmap() {
      console.log("TODO: Save selectedTrack to user's backend profile record:", selectedTrack);
      window.location.href = "roadmap-dashboard.html";
    }
  </script>
</body>
</html>
