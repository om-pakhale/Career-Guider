<!-- Micro-interactions Script -->
<script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('password-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function switchTab(mode) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            
            if (mode === 'login') {
                loginTab.classList.add('tab-active');
                loginTab.classList.remove('text-on-surface-variant');
                registerTab.classList.remove('tab-active');
                registerTab.classList.add('text-on-surface-variant');
            } else {
                registerTab.classList.add('tab-active');
                registerTab.classList.remove('text-on-surface-variant');
                loginTab.classList.remove('tab-active');
                loginTab.classList.add('text-on-surface-variant');
            }
        }

        // Add a subtle mouse parallax to the modal
        document.addEventListener('mousemove', (e) => {
            const modal = document.querySelector('.glass-panel');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            modal.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        // Form submission effect
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = 'Authenticating...';
            btn.classList.add('animate-pulse');
            setTimeout(() => {
                btn.textContent = 'Access Granted';
                btn.classList.remove('animate-pulse');
                btn.classList.replace('glow-button', 'bg-tertiary text-on-tertiary-container');
            }, 1500);
        });
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = e.target.querySelector('input[type="email"]').value;
  const password = document.getElementById('password-input').value;
  const submitBtn = e.target.querySelector('button[type="submit"]');

  submitBtn.textContent = 'Authenticating...';

  // Check if we are in Login or Register mode
  const isRegisterMode = document.getElementById('tab-register').classList.contains('tab-active');

  if (isRegisterMode) {
    // 1. REGISTER NEW USER
    const { data, error } = await supabase.auth.signUp({ email, password });
    
    if (error) {
      alert("Registration Error: " + error.message);
      submitBtn.textContent = 'Unlock My Dashboard / Login';
      return;
    }

    // 2. Insert baseline student profile record
    if (data.user) {
      await supabase.from('student_profiles').insert([
        {
          id: data.user.id,
          full_name: email.split('@')[0],
          email: email,
          level: 1,
          title: 'Novice Adventurer',
          city: 'Nagpur'
        }
      ]);
    }

    // Direct new user to interest assessment quiz
    window.location.href = "interest-quiz.html";

  } else {
    // 1. SIGN IN EXISTING USER
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      alert("Login Error: " + error.message);
      submitBtn.textContent = 'Unlock My Dashboard / Login';
      return;
    }

    // Direct logged-in user straight to main roadmap
    window.location.href = "roadmap-dashboard.html";
  }
});
    </script>
</body>
