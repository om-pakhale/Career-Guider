<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>QuestPath | Member Terminal</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #020617; color: #dae2fd; font-family: 'Geist', sans-serif; }
    .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .tab-active { color: #ddb7ff; border-bottom: 2px solid #ddb7ff; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="glass-panel w-full max-w-xl rounded-2xl overflow-hidden shadow-2xl border border-purple-500/20">
    <!-- Top Alert Banner -->
    <div class="bg-purple-950/80 border-b border-purple-800/40 py-2.5 px-6 flex items-center gap-2 text-purple-300 text-xs font-semibold uppercase tracking-wider">
      <span class="material-symbols-outlined text-sm">lock</span> Member Terminal Access Required
    </div>

    <div class="p-6 md:p-8 space-y-6">
      <div class="text-center">
        <h2 class="text-2xl font-bold text-purple-300">QuestPath Terminal</h2>
        <p class="text-xs text-slate-400 mt-1">Sign in to your account or register as a new student</p>
      </div>

      <!-- Tab Switcher -->
      <div class="flex border-b border-slate-800 text-xs font-bold">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-3 tab-active transition">LOGIN</button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-3 text-slate-400 hover:text-slate-200 transition">NEW STUDENT REGISTER</button>
      </div>

      <!-- Auth Form -->
      <form id="auth-form" class="space-y-4">
        <!-- Register Only: Full Name -->
        <div id="field-name" class="hidden">
          <label class="block text-xs font-semibold text-cyan-400 mb-1">Full Name</label>
          <input type="text" id="input-name" placeholder="Aarav Sharma" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 outline-none focus:border-cyan-400"/>
        </div>

        <!-- Common: Email -->
        <div>
          <label class="block text-xs font-semibold text-cyan-400 mb-1">Email Address</label>
          <input type="email" id="input-email" required placeholder="student@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 outline-none focus:border-cyan-400"/>
        </div>

        <!-- Common: Password -->
        <div>
          <label class="block text-xs font-semibold text-cyan-400 mb-1">Password</label>
          <input type="password" id="input-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 outline-none focus:border-cyan-400"/>
        </div>

        <!-- Register Only: Dynamic Education Type -->
        <div id="field-education" class="hidden space-y-4 pt-2 border-t border-slate-800">
          <label class="block text-xs font-semibold text-cyan-400">Select Education Status</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" id="btn-school" onclick="selectEduType('school')" class="py-2 px-3 rounded-lg border border-cyan-400 bg-cyan-400/10 text-cyan-300 text-xs font-bold transition">
              🏫 School Student
            </button>
            <button type="button" id="btn-college" onclick="selectEduType('college')" class="py-2 px-3 rounded-lg border border-slate-700 text-slate-400 text-xs font-bold transition">
              🎓 College Student
            </button>
          </div>

          <!-- Dynamic: School Fields -->
          <div id="school-subfields" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">School Name</label>
              <input type="text" id="input-school-name" placeholder="St. Xavier High School" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-cyan-400"/>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Class / Grade</label>
              <select id="input-school-grade" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-cyan-400">
                <option>Class 9th</option>
                <option>Class 10th</option>
                <option>Class 11th (Science)</option>
                <option>Class 12th (Science)</option>
              </select>
            </div>
          </div>

          <!-- Dynamic: College Fields -->
          <div id="college-subfields" class="hidden space-y-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">College / Institute Name</label>
              <input type="text" id="input-college-name" placeholder="DKTE Society Institute" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-cyan-400"/>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Year</label>
                <select id="input-college-year" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-cyan-400">
                  <option>1st Year</option>
                  <option>2nd Year</option>
                  <option>3rd Year</option>
                  <option>4th Year</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Department</label>
                <select id="input-college-dept" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-cyan-400">
                  <option>AI & Machine Learning</option>
                  <option>Computer Science</option>
                  <option>Cybersecurity</option>
                  <option>Electronics</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="w-full py-3 bg-gradient-to-r from-cyan-400 to-purple-500 text-slate-950 font-bold rounded-xl transition hover:opacity-90 mt-4">
          Unlock My Dashboard
        </button>
      </form>
    </div>
  </div>

  <script>
    let currentMode = 'login';
    let currentEdu = 'school';

    function switchAuthTab(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const fieldName = document.getElementById('field-name');
      const fieldEdu = document.getElementById('field-education');
      const submitBtn = document.getElementById('btn-submit');

      if (mode === 'register') {
        tabRegister.className = 'flex-1 py-3 tab-active transition font-bold';
        tabLogin.className = 'flex-1 py-3 text-slate-400 hover:text-slate-200 transition';
        fieldName.classList.remove('hidden');
        fieldEdu.classList.remove('hidden');
        submitBtn.textContent = 'Create Adventurer Account & Choose Path ➔';
      } else {
        tabLogin.className = 'flex-1 py-3 tab-active transition font-bold';
        tabRegister.className = 'flex-1 py-3 text-slate-400 hover:text-slate-200 transition';
        fieldName.classList.add('hidden');
        fieldEdu.classList.add('hidden');
        submitBtn.textContent = 'Unlock My Dashboard';
      }
    }

    function selectEduType(type) {
      currentEdu = type;
      const btnSchool = document.getElementById('btn-school');
      const btnCollege = document.getElementById('btn-college');
      const schoolFields = document.getElementById('school-subfields');
      const collegeFields = document.getElementById('college-subfields');

      if (type === 'school') {
        btnSchool.className = 'py-2 px-3 rounded-lg border border-cyan-400 bg-cyan-400/10 text-cyan-300 text-xs font-bold transition';
        btnCollege.className = 'py-2 px-3 rounded-lg border border-slate-700 text-slate-400 text-xs font-bold transition';
        schoolFields.classList.remove('hidden');
        collegeFields.classList.add('hidden');
      } else {
        btnCollege.className = 'py-2 px-3 rounded-lg border border-cyan-400 bg-cyan-400/10 text-cyan-300 text-xs font-bold transition';
        btnSchool.className = 'py-2 px-3 rounded-lg border border-slate-700 text-slate-400 text-xs font-bold transition';
        collegeFields.classList.remove('hidden');
        schoolFields.classList.add('hidden');
      }
    }

    // -------------------------------------------------------------
    // TODO: BACKEND INTEGRATION - AUTHENTICATION SUBMISSION
    // -------------------------------------------------------------
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('input-email').value;
      const password = document.getElementById('input-password').value;

      if (currentMode === 'register') {
        const fullName = document.getElementById('input-name').value;
        const eduDetails = currentEdu === 'school' ? {
          school: document.getElementById('input-school-name').value,
          grade: document.getElementById('input-school-grade').value
        } : {
          college: document.getElementById('input-college-name').value,
          year: document.getElementById('input-college-year').value,
          dept: document.getElementById('input-college-dept').value
        };

        console.log("TODO: Register new user with your custom backend:", { email, fullName, eduDetails });
        // Redirect to onboarding quiz
        window.location.href = "interest-quiz.html";
      } else {
        console.log("TODO: Log in existing user with your custom backend:", { email });
        // Redirect directly to dashboard
        window.location.href = "roadmap-dashboard.html";
      }
    });
  </script>
</body>
</html>
